
name: Feature Request
description: 새로운 기능을 제안합니다.
title: "[Feature] "
labels: ["feature"]
body:
  - type: textarea
    id: purpose
    attributes:
      label: 기능 목적
      description: 어떤 기능이 필요한가요?
      placeholder: 필요한 기능을 작성해주세요.
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: 상세 요구사항
      description: 기능의 동작 방식을 설명해주세요.
      placeholder: 기능의 동작 방식을 작성해주세요.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      description: 어떤 조건을 만족하면 완료인가요?
      placeholder: 기능이 완료되었다고 판단할 조건을 작성해주세요.
    validations:
      required: true
