name: Weekly Summary

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * 1"

permissions:
  issues: read
  pull-requests: read

jobs:
  weekly-summary:
    runs-on: ubuntu-latest

    steps:
      - name: Generate weekly summary
        uses: actions/github-script@v7
        with:
          script: |
            const since = new Date(
              Date.now() - 7 * 24 * 60 * 60 * 1000
            ).toISOString();

            const issues = await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: "all",
                since,
                per_page: 100
              }
            );

            const realIssues = issues.filter(
              item => !item.pull_request
            );

            const pullRequests = issues.filter(
              item => item.pull_request
            );

            await core.summary
              .addHeading("Weekly Project Summary")
              .addRaw(`Period started: ${since}`)
              .addHeading("Activity")
              .addBulletList([
                `Issues updated: ${realIssues.length}`,
                `Pull requests updated: ${pullRequests.length}`
              ])
              .write();