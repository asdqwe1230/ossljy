
name: Cache Benchmark

on:
  workflow_dispatch:

jobs:
  without-cache:
    name: Without pip cache
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Measure installation without cache
        run: |
          START=$(date +%s%3N)
          python -m pip install --no-cache-dir -r requirements.txt
          END=$(date +%s%3N)
          echo "WITHOUT_CACHE_TIME_MS=$((END - START))"

      - name: Run tests
        run: python -m pytest

  with-cache:
    name: With pip cache
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python with pip cache
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Measure installation with cache
        run: |
          START=$(date +%s%3N)
          python -m pip install -r requirements.txt
          END=$(date +%s%3N)
          echo "WITH_CACHE_TIME_MS=$((END - START))"

      - name: Run tests
        run: python -m pytest