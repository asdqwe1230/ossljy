
name: Bug Report
description: 버그 및 오류를 신고합니다.
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 문제 설명
      description: 어떤 문제가 발생했나요?
      placeholder: 오류 내용을 작성해주세요.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      description: 오류가 발생하는 단계를 작성해주세요.
      placeholder: |
        1. 페이지에 접속한다.
        2. 레시피를 등록한다.
        3. 오류를 확인한다.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 기대 결과
      description: 정상적으로 동작한다면 어떻게 되어야 하나요?
    validations:
      required: true
