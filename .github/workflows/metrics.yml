
name: DORA Metrics Collection

on:
  pull_request:
    types: [closed]
  deployment_status:
  issues:
    types: [opened, closed, reopened]
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read
  deployments: read
  issues: read

jobs:
  collect-metrics:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Collect GitHub data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PULL_REQUESTS_JSON=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/pulls?state=closed&per_page=100" \
            | jq -sc 'add | map(select(.merged_at != null) |
              {created_at: .created_at, merged_at: .merged_at})')

          echo "PULL_REQUESTS_JSON=$PULL_REQUESTS_JSON" >> "$GITHUB_ENV"

          DEPLOYMENTS_JSON='['
          FIRST=true

          for ID in $(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/deployments?per_page=100" \
            --jq '.[].id'); do

            CREATED=$(gh api \
              "repos/$GITHUB_REPOSITORY/deployments/$ID" \
              --jq '.created_at')

            STATUS_DATA=$(gh api \
              "repos/$GITHUB_REPOSITORY/deployments/$ID/statuses" \
              --jq '.[0] // {state:"unknown", created_at:""} |
                {status: .state, status_created_at: .created_at}')

            STATUS=$(echo "$STATUS_DATA" | jq -r '.status')
            STATUS_CREATED=$(echo "$STATUS_DATA" | jq -r '.status_created_at // ""')

            if [ "$FIRST" = true ]; then
              FIRST=false
            else
              DEPLOYMENTS_JSON+=','
            fi

            DEPLOYMENTS_JSON+="{\"created_at\":\"$CREATED\",\"status\":\"$STATUS\",\"status_created_at\":\"$STATUS_CREATED\"}"
          done

          DEPLOYMENTS_JSON+=']'
          echo "DEPLOYMENTS_JSON=$DEPLOYMENTS_JSON" >> "$GITHUB_ENV"

          ISSUES_JSON=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/issues?state=all&per_page=100" \
            | jq -sc 'add | map(select(.pull_request == null) |
              {title: .title, labels: [.labels[] | {name: .name}],
               state: .state, created_at: .created_at, closed_at: .closed_at})')

          echo "ISSUES_JSON=$ISSUES_JSON" >> "$GITHUB_ENV"

      - name: Calculate DORA metrics
        run: python scripts/collect_metrics.py

      - name: Add report to Actions summary
        if: success()
        run: cat reports/weekly-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit metrics and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add reports/metrics.json reports/weekly-report.md

          if ! git diff --cached --quiet; then
            git commit -m "Update DORA metrics"
            git push origin HEAD
          else
            echo "No changes to commit"
          fi

      - name: Save metrics and report
        uses: actions/upload-artifact@v4
        with:
          name: dora-metrics
          path: |
            reports/metrics.json
            reports/weekly-report.md
          if-no-files-found: error
          retention-days: 30

