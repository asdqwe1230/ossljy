
name: Python CI-CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # 1단계: Build
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build application
        run: |
          python -m compileall -q src
          mkdir -p dist
          cp -r src dist/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: dist/

  # 2단계: Test
  test:
    name: Test (${{ matrix.os }} / Python ${{ matrix.python-version }})
    needs: build
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: python-app
          path: downloaded-artifact

      - name: Check artifact
        run: |
          python -c "from pathlib import Path; assert Path('downloaded-artifact/src/calculator.py').exists()"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Lint
        run: python -m flake8 src tests

      - name: Run Test
        run: python -m pytest -v

  # 3단계: Deploy
  deploy:
    name: Deploy
    needs: [build, test]
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: python-app
          path: deploy-files

      - name: Check deployment files
        run: |
          ls -R deploy-files
          echo "Build artifact is ready for deployment."

      - name: Check GitHub Secret
        env:
          DEMO_TOKEN: ${{ secrets.DEMO_TOKEN }}
        run: |
          python -c "import os; assert os.getenv('DEMO_TOKEN'), 'DEMO_TOKEN secret is missing'; print('Secret injected successfully. Value is hidden.')"

      - name: Deploy simulation
        run: echo "Deployment simulation successful!"
