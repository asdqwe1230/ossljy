
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSSJY 웹 계산기</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1>OSSJY 웹 계산기</h1>
        <p>GitHub Pages 자동 배포 프로젝트</p>

        <section class="calculator">
            <input type="number" id="num1" placeholder="첫 번째 숫자">
            
            <select id="operator">
                <option value="add">덧셈 (+)</option>
                <option value="subtract">뺄셈 (-)</option>
                <option value="multiply">곱셈 (×)</option>
                <option value="divide">나눗셈 (÷)</option>
            </select>

            <input type="number" id="num2" placeholder="두 번째 숫자">

            <button onclick="calculate()">계산하기</button>

            <h2 id="result">결과: </h2>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
